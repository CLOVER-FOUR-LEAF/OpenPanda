# 桌面工作节点能力卡示例（开发机 / 普通 PC）
# 复制并按实际设备改名后使用：
#   cp config/capabilities.example-desktop.yaml config/capabilities.my-desktop.yaml
# 或直接让 panda 扫描硬件生成草稿：
#   panda detect > capabilities.yaml
#
# 字段与 internal/ledger/capability.go 的 Card 结构一一对应：
#   device         节点名（显示用）
#   resource_class Micro | Standard | Full（调度打分用）
#   node_kind      physical | vm（同机 singleton 锁按 kind 区分）
#   native         本机可确定性执行的白名单命令（tier: 1=可自动执行 2=不可逆需授权）
#   agents         已安装的 agent CLI（adapter 指向 adapters/<name>.py）
#                  tier 缺省为 1：agent 调度默认自动执行，不进待审批。
#                  想让某个 agent 每次都先问你，就在它下面显式写 tier: 2 ——
#                  未授权会被拒绝并进待审批，批准后带授权重跑；
#                  `--authorize` 提交则一次同意直接执行完成。
#   actuators      可由任务驱动的物理/桌面动作（§7.1）。id 用 hardware:*
#                  前缀；command 是驱动可执行文件，不存在会被 PruneUnavailable
#                  Actuators 剪掉；args 里 {intent}/{action}/{param:<name>}
#                  执行时替换。参考驱动见 drivers/（panda-notify 等）。
#   capacity       本节点并行任务数与资源上限
#   resource_profile 声明的硬件（cpu / ram_gb / gpu_vram_gb / duration_hint）。
#                  capacity 是"现在还能接几个"，这里是"跑得动什么"：路由把它当硬判据，
#                  声明 gpu_vram_gb: 8 的任务不会落到 gpu_vram_gb: 0 的节点上。
#                  整段省略等于"未声明"，路由放行 —— 想被排除必须开口。

device: "example-desktop"
resource_class: "Standard"
node_kind: "physical"
chip: "Apple M1 / x86_64"

native:
  - id: "sys:info"
    command: "uname"
    args: ["-a"]
    tier: 1
    description: "system info"
  - id: "disk:usage"
    command: "df"
    args: ["-h", "."]
    tier: 1
    description: "disk usage of the work directory"

agents:
  claude_code:
    adapter: "claude_code.py"
    install_check: "claude --version"
    capabilities: ["coding", "shell", "file_edit", "build"]
    best_at: ["multi_file_edits", "code_search", "running_tests"]
    not_for: ["hardware_io", "realtime_control"]
    cost_tier: "high"
    tier: 1
  codex:
    adapter: "codex.py"
    install_check: "codex --version"
    capabilities: ["coding", "shell", "file_edit"]
    best_at: ["code_review", "refactoring"]
    not_for: ["hardware_io"]
    cost_tier: "medium"
    tier: 1

  # Any headless CLI works without a bespoke adapter: adapter: generic.py +
  # a command template. {prompt} is substituted as one literal argv element
  # (appended when absent); {stdin} pipes the prompt to the CLI's stdin
  # instead, and {cwd} / {resume} / {max_turns} fill in per-task values.
  # Pick the CLI's non-interactive flags — a headless run cannot answer a
  # permission prompt.
  #
  # zcode (Z.AI) — detected automatically via the registry; its headless
  # contract is `zcode --prompt "…"` (community-verified, undocumented
  # upstream). Auth: the TUI setup wizard's ~/.zcode/cli/config.json, or
  # ZCODE_API_KEY/ZCODE_MODEL/ZCODE_BASE_URL env vars.
  #
  # zcode:
  #   adapter: "generic.py"
  #   command: "zcode --prompt {prompt}"
  #   install_check: "zcode --version"
  #   capabilities: ["coding", "shell", "file_edit"]
  #   cost_tier: "low"
  #   tier: 1
  #
  # agy (Antigravity) and grok have their own adapters (antigravity.py /
  # grok_build.py) — declare them like claude_code above.

# 桌面通知执行器：装上 drivers/panda-notify（或改写成绝对路径）后取消注释。
# "panda ask 提醒我构建完成" 会产出 action_spec 路由到这里。
# 注意：`panda detect` 现在会自动探测 drivers/ 下存在的 panda-* 驱动并
# 直接写进生成的卡 —— 驱动就位时下面这些都无需手写。
# actuators:
#   - id: "hardware:notify"
#     type: "software"
#     category: "ui_feedback"
#     interface: "desktop"
#     capabilities: ["notify", "notification", "alert", "通知"]
#     tier: 1
#     command: "panda-notify"
#     args: ["--title", "{param:title}", "--body", "{param:body}"]
#
#   # —— computer-use 眼手对 ——
#   # 该节点必须有真实图形会话（launchd 用户域/桌面登录；systemd --system
#   # 或 SSH 会话看不到屏幕）。macOS 还需在系统设置里给终端/panda 授予
#   # 屏幕录制与辅助功能权限；Linux 需要 xdotool(X11)/ydotool(Wayland)；
#   # Windows 走内置 powershell 路径。
#   - id: "hardware:screen_capture"
#     type: "software"
#     category: "screen_sensing"   # 屏幕内容的专用类目：它的产物在网内
#                                 # 只流 mesh 级信任节点（准入/路由/工件
#                                 # 拉取三道闸）。自定义 actuator id 只要
#                                 # 用这一类目，运行期标记会自动带上该规则
#                                 # （trust.send.guarded.screen 可放行）。
#     capabilities: ["screen", "screenshot", "capture", "gui", "截屏", "屏幕"]
#     tier: 1                       # 截图只读不改状态；注意图中可能含敏感内容
#     command: "panda-screen"       # 写出 ./screen-<ts>-<pid>.png 并打印路径
#   - id: "hardware:gui_input"
#     type: "software"
#     category: "gui_control"
#     interface: "desktop"
#     capabilities: ["gui", "click", "type", "key", "scroll", "mouse", "keyboard", "点击", "输入"]
#     tier: 2                       # 点击/按键不可逆：默认要审批
#     command: "panda-input"
#     args: ["{action}", "{param:args}"]
#     # 调用契约：{"action":"click","parameters":{"args":"640,400"}}
#     #   move/click/dblclick → "x,y[,button]"；type → 文本；
#     #   key → "ctrl+c"/"Return"；scroll → "up|down[,n]"；pos → ""。

capacity:
  cpu_cores: 8
  ram_gb: 16
  max_concurrent_tasks: 3

# 声明的硬件上限，路由的硬判据：任务声明 gpu_vram_gb: 8 时，
# 只有这里 >= 8 的节点才会被选中。整段省略等于"未声明"，路由放行不排除。
resource_profile:
  cpu: 8
  ram_gb: 16
  gpu_vram_gb: 8
  duration_hint: long
